<!-- ==================== JAVASCRIPT EVENTS NOTES ==================== -->

<!-- Event = User ya browser ki kisi activity (click, keyboard press, mouse movement) ko Event kehte hain. -->

<!-- ==================== EVENT HANDLING ==================== -->

<!-- Inline onclick = HTML ke andar event likhna; large applications mein generally avoid karte hain. -->

<!-- .onclick = JavaScript se click event handle kar sakte hain, lekin addEventListener() zyada flexible hai. -->

<!-- addEventListener() = Kisi element par specific event ko listen karne ka modern method hai. -->


<!-- ==================== EVENT OBJECT ==================== -->

<!-- Event Object (e) = Browser automatically event se related information callback function ko object ke form mein deta hai. -->

<!-- event.type = Kaunsa event trigger hua hai, ye batata hai. -->

<!-- event.timeStamp = Event kab trigger hua, uski timing information deta hai. -->

<!-- event.target = Exactly us element ko represent karta hai jahan event actually trigger hua. -->

<!-- event.currentTarget = Us element ko represent karta hai jiske event listener mein code run ho raha hai. -->


<!-- ==================== EVENT PROPAGATION ==================== -->

<!-- Event Propagation = Event ka DOM tree ke elements ke beech travel karna. -->

<!-- Event Bubbling = Event child element se parent element ki taraf travel karta hai. -->

<!-- Event Capturing = Event parent element se child element ki taraf travel karta hai. -->

<!-- false = Default bubbling phase; isliye normally third parameter likhne ki zarurat nahi hoti. -->

<!-- true = Event listener ko capturing phase mein handle karne ke liye use hota hai. -->


<!-- ==================== EVENT CONTROL ==================== -->

<!-- stopPropagation() = Event ko DOM tree mein aage propagate hone se rokta hai. -->

<!-- preventDefault() = Element ke default browser behavior ko rokta hai. -->


<!-- ==================== DOM + EVENTS ==================== -->

<!-- event.target.tagName = Click hue element ka tag name batata hai, jaise IMG ya LI. -->

<!-- parentNode = Current element ke parent element ko access karta hai. -->

<!-- .remove() = Selected element ko DOM se remove karta hai. -->

<!-- removeChild() = Parent element ke kisi specific child ko remove karta hai. -->


<!-- ==================== IMPORTANT CONCEPT ==================== -->

<!-- Event Delegation = Parent par ek event listener lagakar event.target se clicked child ko identify aur handle karna. -->

<!-- Memory Trick: Click → Event Object → Target identify → Bubbling/Capturing → Required Action -->
